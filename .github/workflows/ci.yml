name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # NOTE: `cellpainting` added now that Module 1 has code. As each
      # remaining module lands, add its extra here (or split into a matrix)
      # so CI actually exercises that module's dependencies.
      - name: Install dependencies
        run: pip install -e ".[dev,cellpainting]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy

      # Excludes `slow` tests (e.g. live S3 downloads): push CI should be
      # fast and deterministic, not depend on an external bucket being
      # reachable. Slow tests run via the weekly smoke test instead.
      - name: Test
        run: pytest -m "not slow"
