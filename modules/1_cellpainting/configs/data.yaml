# Module 1 validation-pass data subset.
#
# One plate, 14 compounds (within the agreed 10-15 range), chosen to prove
# out the download -> CellProfiler-feature -> model pipeline before scaling
# up. See docs/build-log.md for why this plate/platemap was picked and
# DATA_SOURCES.md for dataset-level provenance.
#
# All fields below were verified directly against the live, public,
# no-sign-request S3 bucket on 2026-07-20 (object listing + sizes), not
# assumed from documentation alone.

source:
  bucket: cellpainting-gallery
  dataset: cpg0000-jump-pilot
  source_name: source_4
  batch: 2020_11_04_CPJUMP1
  plate: BR00116991
  measurement: "2020-11-05T19_51_35-Measurement1"
  # JUMP-Target-1_compound_platemap (compound-perturbation plate, A549 cells,
  # parental cell line, 24h timepoint). Three replicate plates of this same
  # platemap also exist in this batch (BR00116992-BR00116994) if more
  # in-batch replicates are ever needed; the cross-batch transfer plate will
  # come from a different batch entirely, not one of these replicates.
  platemap: JUMP-Target-1_compound_platemap
  cell_line: A549 (parental)

# Per well: 9 sites (f01-f09), 1 focal plane (p01), 8 channels (ch1-ch8).
sites_per_well: 9
planes_per_site: 1
channels_per_site: 8

# Channel-index -> stain mapping, confirmed (not assumed) by cross-referencing
# three independent sources for this exact plate on 2026-07-20:
#   1. This plate's own Images/Index.idx.xml (raw Harmony/Phenix acquisition
#      metadata): ChannelID -> ChannelName + excitation/emission wavelength,
#      identical across every well/site/plane on the plate.
#   2. jump-cellpainting/2021_Chandrasekaran_submitted's README, which lists
#      this same batch's ch01-ch08 fluorophore names independently of the XML.
#   3. This plate's own workspace/load_data_csv/.../load_data.csv (Broad's
#      CellProfiler input file for this plate), whose URL_Orig<Stain> columns
#      point directly at specific chN filenames -- the ground truth actually
#      used to generate Broad's published CellProfiler profiles.
# All three agree. ch1-ch5 are the standard 5-channel Cell Painting stain set
# (Mito/AGP/RNA/ER/DNA); ch6-ch8 are non-fluorescent brightfield/z-stack
# channels specific to this batch, not part of the standard assay.
channels:
  ch1: {stain: Mito, fluorophore: "Alexa 647", excitation_nm: 640, emission_nm: 706}
  ch2: {stain: AGP, fluorophore: "Alexa 568", excitation_nm: 561, emission_nm: 599}
  ch3: {stain: RNA, fluorophore: "488 long", excitation_nm: 488, emission_nm: 599}
  ch4: {stain: ER, fluorophore: "Alexa 488", excitation_nm: 488, emission_nm: 522}
  ch5: {stain: DNA, fluorophore: "HOECHST 33342", excitation_nm: 405, emission_nm: 456}
  ch6: {stain: HighZBF, fluorophore: "Brightfield H", excitation_nm: 740, emission_nm: null}
  ch7: {stain: LowZBF, fluorophore: "Brightfield L", excitation_nm: 740, emission_nm: null}
  ch8: {stain: Brightfield, fluorophore: "Brightfield", excitation_nm: 740, emission_nm: null}
# Model input channels: ch1-ch5 (the 5 fluorescent Cell Painting stains).
# ch6-ch8 are brightfield/z-stack channels, not part of the standard assay,
# and are excluded from model input.
model_input_channels: [ch1, ch2, ch3, ch4, ch5]

compounds:
  # well, broad_sample (Broad compound ID), pert_iname (compound name), and
  # targets (pipe-joined gene symbols) are copied verbatim from
  # JUMP-Target-1_compound_platemap.tsv / JUMP-Target-1_compound_metadata.tsv
  # (https://github.com/jump-cellpainting/JUMP-Target), cross-referenced
  # against this specific plate's platemap above.
  - well: A01
    broad_sample: BRD-A86665761-001-01-1
    pert_iname: gabapentin-enacarbil
    targets: CACNA1A|CACNA1B|CACNA1C|CACNA1D|CACNA1E|CACNA1F|CACNA1G|CACNA1H|CACNA1I|CACNA1S|CACNA2D1|CACNA2D2|CACNA2D3|CACNA2D4|CACNB1|CACNB2|CACNB3|CACNB4|CACNG1|CACNG2|CACNG3|CACNG4|CACNG5|CACNG6|CACNG7|CACNG8
  - well: A03
