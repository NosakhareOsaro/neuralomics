[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralomics"
version = "0.1.0.dev0"
description = "A deep-learning-for-genomics research toolkit studying how representation-learning strategies transfer across unseen biological contexts."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Nosakhare Osaro", email = "osaronosakhare@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "mlflow>=2.10",
]

[project.optional-dependencies]
# Module 1: Cell Painting morphological profiling
cellpainting = [
    "torch>=2.2",
    "torchvision>=0.17",
    "scikit-learn>=1.4",
    "umap-learn>=0.5",
    "shap>=0.45",
    "xgboost>=2.0",
    "boto3>=1.34",
    "pyarrow>=15.0",
    "pillow>=10.2",
]
# Module 2: GNN for scRNA-seq cell-type classification
gnn-scrna = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "scanpy>=1.10",
    "anndata>=0.10",
    "pytorch-lightning>=2.2",
    "optuna>=3.5",
]
# Module 3: Genomic foundation model fine-tuning
genomic-fm = [
    "torch>=2.2",
    "transformers>=4.38",
    "datasets>=2.17",
    "accelerate>=0.27",
]
# Module 4: GNN drug-target interaction prediction
dti-gnn = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "rdkit>=2023.9.5",
    "fair-esm>=2.0",
    "scipy>=1.12",
]
# MLOps serving layer
mlops = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.2",
    "mypy>=1.9",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

[tool.hatch.build.targets.wheel]
packages = ["common", "modules/1_cellpainting/src/cellpainting"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["common", "modules/1_cellpainting/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
addopts = "--cov=common --cov=cellpainting --cov-report=term-missing"
markers = [
    "slow: exercises real data download/training, skipped by the weekly smoke test's fast subset",
]
